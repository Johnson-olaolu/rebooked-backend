plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.springdoc.openapi-gradle-plugin' version "1.9.0"
}

group = 'com.personal'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("dev.langchain4j:langchain4j-bom:1.3.0")
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'com.google.code.gson:gson'
    implementation 'dev.langchain4j:langchain4j-spring-boot-starter'
    implementation 'dev.langchain4j:langchain4j-open-ai-spring-boot-starter'
    implementation 'com.google.api-client:google-api-client:1.32.1'
    implementation 'com.cloudinary:cloudinary-http5:2.0.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def adminFrontendDir = file('services/rebooked-admin')
def adminFrontendDist = file('services/rebooked-admin/dist')

tasks.register('installAdminFrontend', Exec) {
    workingDir adminFrontendDir
    commandLine 'npm', 'ci'
    inputs.files(file('services/rebooked-admin/package.json'), file('services/rebooked-admin/package-lock.json'))
    outputs.file(file('services/rebooked-admin/node_modules/.package-lock.json'))
}

tasks.register('buildAdminFrontend', Exec) {
    dependsOn tasks.named('installAdminFrontend')
    workingDir adminFrontendDir
    commandLine 'npm', 'run', 'build'
    inputs.files(fileTree('services/rebooked-admin/src'), file('services/rebooked-admin/index.html'),
            file('services/rebooked-admin/vite.config.ts'), file('services/rebooked-admin/tsconfig.json'),
            file('services/rebooked-admin/package.json'), file('services/rebooked-admin/package-lock.json'))
    outputs.dir(adminFrontendDist)
}

tasks.named('processResources') {
    dependsOn tasks.named('buildAdminFrontend')
    from(adminFrontendDist) {
        into 'static/admin-dashboard'
    }
}
