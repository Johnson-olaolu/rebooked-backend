version: '3.8'

services:
  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    # volumes:
    #   - db:/data/db # specify the absolute path inside the container
    networks:
      - rebooked

  redis:
    image: redis:7
    # AOF every second: a crash loses at most 1 s of views. volatile-lru only evicts keys with an
    # expiry, so views:pending and recent:dirty are never evicted (see API_CHANGES.md #21e)
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    networks:
      - rebooked

networks:
  rebooked:
    driver: bridge

volumes:
  db:
  redis-data: