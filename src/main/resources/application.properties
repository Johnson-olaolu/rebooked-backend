spring.application.name=rebooked
server.port=${PORT}
server.servlet.context-path=/api
server.forward-headers-strategy=framework
# Errors are rendered by exception/GlobalExceptionHandler as { status, message, errors? }
spring.mvc.problemdetails.enabled = false
spring.web.resources.add-mappings=false
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
security.jwt.secret-key=${SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME}
security.jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION_TIME:2592000000}
springdoc.swagger-ui.path=/documentation
springdoc.swagger-ui.persist-authorization=true
spring.thymeleaf.prefix=classpath:/templates/mail/

#Google details
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI}

#Client
client.data-url=${CLIENT_URL}
# Frontend origins for the chat socket (comma-separated, exact origins); CLIENT_URL's origin is always added
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5179}

#Cloudinary
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudnairy.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder-name=${CLOUDINARY_FOLDER_NAME}

#Resend (transactional email). RESEND_FROM must be on a domain verified in Resend, e.g. "Rebooked <hello@yourdomain.com>"
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}

#Brevo
brevo.api.key=${BREVO_API_KEY}
brevo.api.url=${BREVO_API_URL}
brevo.mailing-list.rebooked-monthly-id=${BREVO_REBOOKED_MONTHLY_MAILING_LIST_ID}

#Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

#AI Service (Gemini via OpenAI-compatible API)
langchain4j.open-ai.chat-model.api-key=${GEMINI_API_KEY}
langchain4j.open-ai.chat-model.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
langchain4j.open-ai.chat-model.model-name=${GEMINI_MODEL}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Authors (API_CHANGES.md §23)
# External biographies and photos stay hidden until someone reviews the Open Library and Wikimedia reuse terms
authors.display.external-bios=${AUTHORS_EXTERNAL_BIOS:false}
authors.display.external-photos=${AUTHORS_EXTERNAL_PHOTOS:false}
# The monthly Open Library import (true in production); POST /admin/author-import works either way
authors.import.enabled=${AUTHORS_IMPORT_ENABLED:false}
authors.import.dir=${AUTHORS_IMPORT_DIR:./data/imports}
authors.import.cron=${AUTHORS_IMPORT_CRON:0 0 3 1 * *}
authors.import.openlibrary-url=${AUTHORS_IMPORT_OPENLIBRARY_URL:https://openlibrary.org/data}
wikidata.api-url=${WIKIDATA_API_URL:https://www.wikidata.org/w/api.php}
# Sent to Open Library and Wikidata: a client name plus a contact address the operator sets, e.g.
# "RebookedAuthorImporter/1.0 (https://rebooked.example; ops@rebooked.example)"
wikidata.user-agent=${WIKIDATA_USER_AGENT:RebookedAuthorImporter/1.0}

# How often view counts and recently viewed move from Redis to Mongo (ISO-8601 duration)
views.flush-interval=${VIEWS_FLUSH_INTERVAL:PT5M}

# Homepage snapshot jobs (API_CHANGES.md §24h). Intervals are ISO-8601 durations; crons run in Africa/Lagos
homepage.stats-interval=${HOMEPAGE_STATS_INTERVAL:PT15M}
homepage.trending-interval=${HOMEPAGE_TRENDING_INTERVAL:PT1H}
homepage.reviews-interval=${HOMEPAGE_REVIEWS_INTERVAL:PT1H}
homepage.daily-cron=${HOMEPAGE_DAILY_CRON:0 30 2 * * *}
homepage.ai-picks-cron=${HOMEPAGE_AI_PICKS_CRON:0 0 3 * * *}
homepage.weekly-cron=${HOMEPAGE_WEEKLY_CRON:0 0 6 * * MON}

# Demo data, local only and off by default: --seed.demo=true seeds, --seed.demo.reset=true removes it (see README).
# Also seed.demo.allow-remote, seed.demo.books (5000), seed.demo.random-seed (42), seed.demo.fixture.
