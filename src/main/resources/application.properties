spring.application.name=rebooked
server.port=${PORT}
server.servlet.context-path=/api
server.forward-headers-strategy=framework
# Errors are rendered by exception/GlobalExceptionHandler as { status, message, errors? }
spring.mvc.problemdetails.enabled = false
spring.web.resources.add-mappings=false
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
security.jwt.secret-key=${SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME}
security.jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION_TIME:2592000000}
springdoc.swagger-ui.path=/documentation
springdoc.swagger-ui.persist-authorization=true
spring.thymeleaf.prefix=classpath:/templates/mail/

#Google details
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI}

#Client
client.data-url=${CLIENT_URL}
# Frontend origins for the chat socket (comma-separated, exact origins); CLIENT_URL's origin is always added
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5179}

#Cloudinary
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudnairy.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder-name=${CLOUDINARY_FOLDER_NAME}

#Resend (transactional email). RESEND_FROM must be on a domain verified in Resend, e.g. "Rebooked <hello@yourdomain.com>"
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}

#Brevo
brevo.api.key=${BREVO_API_KEY}
brevo.api.url=${BREVO_API_URL}
brevo.mailing-list.rebooked-monthly-id=${BREVO_REBOOKED_MONTHLY_MAILING_LIST_ID}

#Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

#AI Service (Gemini via OpenAI-compatible API)
langchain4j.open-ai.chat-model.api-key=${GEMINI_API_KEY}
langchain4j.open-ai.chat-model.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
langchain4j.open-ai.chat-model.model-name=${GEMINI_MODEL}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# How often view counts and recently viewed move from Redis to Mongo (ISO-8601 duration)
views.flush-interval=${VIEWS_FLUSH_INTERVAL:PT5M}
